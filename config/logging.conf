[loggers]
keys=root, my_logger

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger___main__]
level=DEBUG
handlers=consoleHandler,fileHandler

[logger_my_logger]
level=DEBUG
handlers=consoleHandler, fileHandler
qualname=my_logger  #logger 名称
propagate=0

[handler_consoleHandler]
class=StreamHandler  #使用 streamhandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,) #输出到标准输出

[handler_fileHandler]
class=FileHandler  #使用 filehandler
level=INFO
formatter=simpleFormatter
args=('my_app.log', 'a') #输出到文件，追加模式

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S